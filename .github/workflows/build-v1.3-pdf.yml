name: Build and publish textbook PDF v1.3
on:
  push:
    branches:
      - release/v1.3-pdf-and-complete-notebooks
    paths:
      - 'textbook/**'
      - '.github/workflows/build-v1.3-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-japanese texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk poppler-utils
      - name: Compile XeLaTeX three times
        working-directory: textbook
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex > latex-pass1.log
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex > latex-pass2.log
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex > latex-pass3.log
      - name: Validate PDF
        run: |
          test -s textbook/main.pdf
          pdfinfo textbook/main.pdf
          pages=$(pdfinfo textbook/main.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -eq 115
          if grep -Eq 'undefined references|undefined citations' textbook/latex-pass3.log; then exit 1; fi
      - name: Publish PDF in this branch
        run: |
          cp textbook/main.pdf docs/galactic_dynamics_numerical_methods_v1.3.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/galactic_dynamics_numerical_methods_v1.3.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: publish v1.3 textbook PDF (115 pages)"
          git push origin HEAD:${{ github.ref_name }}
